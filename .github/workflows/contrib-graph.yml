name: Katkı grafiği

on:
  schedule:
    - cron: "17 21 * * *"   # her gün 00:17 (Türkiye saati)
  workflow_dispatch:         # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grafiği üret
        env:
          # Özel repo katkıları da sayılsın diye kendi token'ın (GH_PAT) varsa o kullanılır
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python contrib_graph.py "${{ github.repository_owner }}" assets

      - name: Değiştiyse commit at
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "Katkı grafiğini güncelle"
          git push
