name: Test rozetleri

on:
  schedule:
    - cron: "23 * * * *"   # saatte bir
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozetleri güncelle
        env:
          # carfollow'da "Actions: read" izni olan fine-grained token
          GH_TOKEN: ${{ secrets.TEST_BADGE_TOKEN }}
        run: python3 test_badges.py
      - name: Değiştiyse commit at
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add assets/*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Test rozetlerini güncelle"
          git push
